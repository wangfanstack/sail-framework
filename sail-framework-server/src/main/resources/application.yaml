spring:
  application:
    name: sail-framework-server

  profiles:
    active: @spring.profiles.active@

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。

  # Servlet 配置
  servlet:
    # 文件上传相关配置项
    multipart:
      max-file-size: 20MB # 单个文件大小
      max-request-size: 20MB # 设置总上传的文件大小

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 Date 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  # Cache 配置项
  cache:
    type: REDIS
    redis:
      time-to-live: 1h # 设置过期时间为 1 小时

server:
  forward-headers-strategy: framework # 域名经 Nginx HTTPS 反代时，使用 X-Forwarded-* 生成外部访问地址
  servlet:
    encoding:
      enabled: true
      charset: UTF-8 # 必须设置 UTF-8，避免流式返回时会乱码问题
      force: true

--- #################### 接口文档配置 ####################

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  default-flat-param-object: true # 将分页等参数对象平铺为独立 query 参数，文档展示更直观

# Scalar API 文档 UI：规范由 springdoc 的 /v3/api-docs 提供，不引入 Swagger UI / Knife4j
scalar:
  enabled: true
  path: /scalar # 文档 UI 地址
  page-title: ${sail-framework.swagger.title} API 文档
  sources: # 与各模块 GroupedOpenApi 分组一一对应
    - url: /v3/api-docs/all
      title: 全部
    - url: /v3/api-docs/system
      title: System 系统
    - url: /v3/api-docs/infra
      title: Infra 基础设施

--- #################### 监控相关配置 ####################

# Actuator 健康端点：匿名仅见总体状态；认证后（含 Spring Boot Admin 带凭据回访）可见组件细节
management:
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  tracing:
    sampling:
      probability: 1.0 # 默认 0.1 会导致 90% 请求无 traceId，日志链路关联必须全量采样（无上报后端，开销可忽略）
    propagation:
      produce: w3c # 显式 W3C 透传，微服务化后跨服务链路可直接续接
      consume: w3c

# MyBatis Plus 的配置项
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
  global-config:
    db-config:
      id-type: NONE # “智能”模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
    banner: false # 关闭控制台的 Banner 打印
  type-aliases-package: ${sail-framework.info.base-package}.module.*.dal.dataobject

--- #################### Spring Boot Admin 配置 ####################

spring:
  data:
    redis:
      repositories:
        enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度
  # Spring Boot Admin：嵌入式 Server + Client 自注册（公共配置；frame-ancestors 等环境差异项见各 profile）
  boot:
    admin:
      context-path: /admin
      client:
        url: http://127.0.0.1:${server.port}/${spring.boot.admin.context-path} # Spring Boot Admin Server 地址
        username: ${AGRI4J_MONITOR_USERNAME} # Client 注册到 Server 的认证账号；同时用于 Server 端登录
        password: ${AGRI4J_MONITOR_PASSWORD}
        instance:
          service-host-type: IP # 注册实例时，优先使用 IP [IP, HOST_NAME, CANONICAL_HOST_NAME]
          metadata: # Server 回访本实例 Actuator 端点时携带的认证凭据
            user:
              name: ${AGRI4J_MONITOR_USERNAME}
              password: ${AGRI4J_MONITOR_PASSWORD}

--- #################### 验证码相关配置 ####################

aj:
  captcha:
    jigsaw: classpath:images/jigsaw # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    pic-click: classpath:images/pic-click # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    cache-type: redis # 缓存 local/redis...
    cache-number: 1000 # local 缓存的阈值,达到这个值，清除缓存
    timing-clear: 180 # local定时清除过期缓存(单位秒),设置为0代表不执行
    type: blockPuzzle # 验证码类型 default 三种都实例化。blockPuzzle 滑块拼图、clickWord 文字点选、pictureWord 文本输入
    water-mark: 农E链 # 右下角水印文字
    interference-options: 0 # 滑动干扰项(0/1/2)
    req-frequency-limit-enable: false # 接口请求次数一分钟限制是否开启 true|false
    req-get-lock-limit: 5 # 验证失败 5 次，get接口锁定
    req-get-lock-seconds: 10 # 验证失败后，锁定时间间隔
    req-get-minute-limit: 30 # get 接口一分钟内请求数限制
    req-check-minute-limit: 60 # check 接口一分钟内请求数限制
    req-verify-minute-limit: 60 # verify 接口一分钟内请求数限制

--- #################### 农E链相关配置 ####################

sail-framework:
  info:
    version: 1.0.0
    base-package: cn.sailstack
  web:
    admin-ui:
      url: http://dashboard.sail-framework.iocoder.cn # Admin 管理后台 UI 的地址
  xss:
    enable: false
    exclude-urls: # 如下两个 url，仅仅是为了演示，去掉配置也没关系
      - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
      - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
  security:
    permit-all-urls:
      - /admin-api/mp/open/** # 微信公众号开放平台，微信回调接口，不需要登录
  api-encrypt:
    enable: false # 是否开启 API 加密。默认关闭；开启时密钥经环境变量注入（AGRI4J_API_ENCRYPT_REQUEST_KEY / RESPONSE_KEY）
    algorithm: AES # 加密算法，支持 AES、RSA
    request-key: ${AGRI4J_API_ENCRYPT_REQUEST_KEY:} # 请求加密秘钥：AES 必须 16、24、32 位；RSA 时此值为 PKCS#8 私钥
    response-key: ${AGRI4J_API_ENCRYPT_RESPONSE_KEY:} # 响应加密秘钥：AES 必须 16、24、32 位；RSA 时此值为 X.509 公钥
  websocket:
    enable: true # websocket的开关
    path: /infra/ws # 路径
    sender-type: redis # 消息发送的类型，可选值为 local、redis、rocketmq、rabbitmq（后两者需引入对应 MQ 依赖并补连接配置）
    sender-rocketmq:
      topic: ${spring.application.name}-websocket # 消息发送的 RocketMQ Topic
      consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 RocketMQ Consumer Group
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange # 消息发送的 RabbitMQ Exchange
      queue: ${spring.application.name}-websocket-queue # 消息发送的 RabbitMQ Queue
  swagger:
    title: 农E链快速开发平台
    description: 提供管理后台、用户 App 的所有功能
    version: ${sail-framework.info.version}
    url: ${sail-framework.web.admin-ui.url}
    email: xingyu4j@vip.qq.com
    license: MIT
    license-url: https://gitee.com/zhijiantianya/ruoyi-vue-pro/blob/master/LICENSE
  codegen:
    base-package: ${sail-framework.info.base-package}
    front-type: 20 # 前端模版的类型，参见 CodegenFrontTypeEnum 枚举类
    vo-type: 10 # VO 的类型，参见 CodegenVOTypeEnum 枚举类
    delete-batch-enable: true # 是否生成批量删除接口
    unit-test-enable: false # 是否生成单元测试
    import-enable: false # 是否生成 Excel 导入接口
  tenant: # 多租户相关配置项
    enable: true
    ignore-urls:
      - /jmreport/* # 积木报表，无法携带租户编号
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-tables:
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
  sms-code: # 短信验证码相关的配置项
    expire-times: 10m
    send-frequency: 1m
    send-maximum-quantity-per-day: 10
    begin-code: 000000 # 这里配置 0000 的原因是，测试方便。
    end-code: 999999 # 这里配置 9999 的原因是，测试方便。

logging:
  level:
    # Spring 自动代理器会在 BPP 注册阶段强制提前实例化所有 Advisor Bean（mzt 操作日志、数据权限切面等），
    # 由此触发 BeanPostProcessorChecker 的良性告警，属框架机制无法从 Bean 定义层面消除，故仅保留 error 级别。
    # logger 名含 $ 与大写（内部类），必须用 "[...]" 括号语法，否则松散绑定会剥掉 $ 和大小写导致配置不生效
    "[org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker]": error
